# Adds the day's row to STRATEGY_LOG.md after each market close and commits it,
# so the log on GitHub stays current without anyone running a command. Option
# prices are stale right after the close, so the first row is preliminary and a
# second run the next morning replaces it with Alpaca's official figures.
#
# Needs two repository secrets: ALPACA_API_KEY and ALPACA_SECRET_KEY (the PAPER
# keys). It only reads the account; it never places orders.
name: Daily journal

on:
  schedule:
    # Times are UTC and assume Eastern standard time.
    - cron: "20 21 * * 1-5"  # 4:20 pm Mon-Fri: a preliminary row right after the close
    - cron: "0 13 * * 2-6"   # 8:00 am Tue-Sat: replace it with Alpaca's official close
  workflow_dispatch:          # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record the day's results
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::warning::Alpaca secrets are not set on this repository; skipping."
            exit 0
          fi
          python3 bot.py journal
          python3 bot.py memory
          python3 dashboard.py

      - name: Commit the updated log and memory
        run: |
          git add STRATEGY_LOG.md memory docs
          if git diff --cached --quiet; then
            echo "No change (market holiday or already recorded)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily journal: $(TZ=America/New_York date +%Y-%m-%d)"
          git push
